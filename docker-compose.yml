version: '3.9'

services:
  jami-web:
    image: jami-web
    environment:
      NODE_ENV: production
    build:
      context: .
      target: production
    ports:
      - '8080:8080'
    stdin_open: true
    depends_on:
      - jami-daemon

  jami-daemon:
    image: jami-daemon
    build:
      context: ./daemon
      args:
        cmake_args: '-DJAMI_NODEJS=ON'
