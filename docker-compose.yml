version: '3.9'

services:
  jami-web:
    image: jami-web
    environment:
      NODE_ENV: production
    build:
      context: .
      target: production
    volumes:
        - jami-web-data:/root/.local/share/jami-web
        - jami-data:/root/.local/share/jami
    ports:
      - '8080:8080'
    stdin_open: true
    depends_on:
      - jami-daemon

  jami-daemon:
    image: jami-daemon
    build:
      context: ./daemon
      args:
        cmake_args: '-DJAMI_NODEJS=ON'

volumes:
  jami-web-data:
  jami-data: